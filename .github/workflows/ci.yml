name: CompraVenta CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: compraventa_test
          POSTGRES_PASSWORD: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations
        run: |
          for f in migrations/*.sql; do
            PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d compraventa_test -f "$f" || true
          done

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/compraventa_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m pytest tests/ -v --tb=short -x \
            -m "not load" \
            --cov=api --cov=processor --cov=scraper \
            --cov-report=term-missing \
            --cov-fail-under=70

      - name: Lint check
        run: |
          pip install ruff
          ruff check api/ processor/ scraper/ --select E,F,W --ignore E501
