##
## CompraVenta — Production Docker Compose
##
## Adds: restart policies, health checks, resource limits, logging
##
## Usage:
##   docker compose -f docker-compose.prod.yml up -d
##   docker compose -f docker-compose.prod.yml logs -f scraper processor
##

services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-compraventa}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d compraventa"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-compraventa}
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ROI_ALERT_THRESHOLD: ${ROI_ALERT_THRESHOLD:-0.20}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200,http://localhost}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-300}
      API_KEY: ${API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  processor:
    build:
      context: .
      dockerfile: Dockerfile.processor
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-compraventa}
      REDIS_URL: redis://redis:6379/0
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.82}
      CONSUMER_NAME: ${CONSUMER_NAME:-processor-1}
      BATCH_SIZE: ${BATCH_SIZE:-256}
      PREFETCH_SIZE: ${PREFETCH_SIZE:-1024}
      PROCESSOR_MODE: pipeline
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis; r=redis.from_url('redis://redis:6379/0'); info=r.xinfo_groups('raw_listings_queue'); exit(0 if info else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    restart: always
    environment:
      REDIS_URL: redis://redis:6379/0
      SEARCH_TERMS: ${SEARCH_TERMS:-sony wh-1000xm4,airpods pro,nintendo switch}
      SCRAPE_INTERVAL: ${SCRAPE_INTERVAL:-300}
      MAX_RESULTS: ${MAX_RESULTS:-20}
      SCRAPER_MODE: ${SCRAPER_MODE:-orchestrated}
      PROXY_URL: ${PROXY_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis, time; r=redis.from_url('redis://redis:6379/0'); info=r.xinfo_stream('raw_listings_queue'); ts=int(info['last-generated-id'].split('-')[0])/1000; exit(0 if time.time()-ts < 1800 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  pgdata:
  redisdata:
